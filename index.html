<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>informationcollapse</title>
<style>
:root{color-scheme:light;font-synthesis:none}
html,body{margin:0;padding:0;background:#fff;color:#000}
body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK JP","Noto Serif","Songti SC","Noto Naskh Arabic",serif;font-size:clamp(15px,1.8vw,19px);font-weight:400;line-height:1.9;letter-spacing:.025em}
main{margin:0 auto;max-width:840px;padding:8vh clamp(22px,5vw,64px) 24vh;min-height:80vh;box-sizing:border-box}
#stream{white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere}
.entry{margin:0 0 1.25em;white-space:pre-wrap;unicode-bidi:plaintext;}
footer{position:fixed;right:0;bottom:0;left:0;box-sizing:border-box;padding:9px 17px 10px;background:#fff;color:#000;font-size:10px;letter-spacing:0;line-height:1.7;border:0;font-variant-numeric:tabular-nums;opacity:.64}
#source{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bits{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media(max-width:600px){body{font-size:16px}main{padding:6vh 20px 25vh}footer{padding:8px 12px;font-size:9px}}
::selection{background:#000;color:#fff}
</style>
</head>
<body>
<main id="stream" aria-live="off"></main>
<footer aria-label="公開情報量と出典"><span id="bits">公開記録 0 bit / この画面で表示 0 bit</span><span id="source">記録を取得しています。</span></footer>
<script src="assets/stream.js" defer></script>
</body>
</html>
